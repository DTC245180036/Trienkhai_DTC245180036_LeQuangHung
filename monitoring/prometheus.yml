global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Giám sát tài nguyên máy chủ vật lý / máy ảo Ubuntu
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  # Giám sát ứng dụng Backend API phòng khám
  - job_name: 'clinic_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
