# Giới hạn số lượng request để chống tấn công brute-force / spam
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost clinic.local;

    # Cho phép tải file ảnh X-quang/siêu âm lên tới 50MB
    client_max_body_size 50M;

    # Ẩn phiên bản Nginx để bảo mật hệ thống
    server_tokens off;

    # Cấu hình các Security Headers bảo mật
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Nén dữ liệu truyền tải
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    # 1. Định tuyến Giao diện Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Định tuyến API Xử lý Nghiệp vụ
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Phục vụ Trực tiếp File Upload (Ảnh X-quang, Bệnh án)
    location /static/uploads/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Trang thông báo lỗi chuẩn hóa
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 4. Cấu hình HTTPS (SSL/TLS Termination) - Port 443
server {
    listen 443 ssl;
    server_name localhost clinic.local;

    # Cho phép tải file ảnh X-quang/siêu âm lên tới 50MB
    client_max_body_size 50M;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Ẩn phiên bản Nginx để bảo mật hệ thống
    server_tokens off;

    # Cấu hình các Security Headers bảo mật cấp cao (HSTS, X-Frame, X-XSS, MIME)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /static/uploads/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
